<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>高知市 散歩ルート提案（Googleマップ）</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    #controls {
      padding: 10px;
      background: #f4f4f4;
    }
    #map {
      width: 100%;
      height: 80vh;
    }
    select, button {
      margin-right: 10px;
    }
  </style>
</head>
<body>

<div id="controls">
  <label>気分:</label>
  <select id="mood">
    <option value="">選択</option>
    <option value="scenery">風景</option>
    <option value="cafe">カフェ</option>
    <option value="history">歴史</option>
  </select>

  <label>距離:</label>
  <select id="distance">
    <option value="">選択</option>
    <option value="short">～3km</option>
    <option value="medium">3～6km</option>
    <option value="long">6km～</option>
  </select>

  <button onclick="showRoute()">ルート表示</button>
</div>

<div id="map"></div>

<script>
let map;
let polyline;
let markers = [];

// 高知市の散歩ルート（簡易ルート：始点〜終点）
const routes = [
  {
    name: "高知城 歴史散策",
    mood: "history",
    distance: "short",
    path: [
      { lat: 33.5597, lng: 133.5311 }, // 高知城
      { lat: 33.5585, lng: 133.5335 }  // 高知城歴史博物館
    ]
  },
  {
    name: "はりまや橋 カフェ巡り",
    mood: "cafe",
    distance: "medium",
    path: [
      { lat: 33.5603, lng: 133.5433 }, // はりまや橋
      { lat: 33.5582, lng: 133.5400 }  // 追手筋
    ]
  },
  {
    name: "鏡川リバーサイド",
    mood: "scenery",
    distance: "medium",
    path: [
      { lat: 33.5572, lng: 133.5266 }, // 鏡川
      { lat: 33.5535, lng: 133.5200 }
    ]
  },
  {
    name: "桂浜 海辺散歩",
    mood: "scenery",
    distance: "long",
    path: [
      { lat: 33.4969, lng: 133.5716 }, // 桂浜
      { lat: 33.4945, lng: 133.5758 }
    ]
  }
];

// マップ初期化
function initMap() {
  map = new google.maps.Map(document.getElementById("map"), {
    center: { lat: 33.5597, lng: 133.5311 },
    zoom: 13
  });
}

// ルート表示
function showRoute() {
  const mood = document.getElementById("mood").value;
  const distance = document.getElementById("distance").value;

  const route = routes.find(r =>
    (mood === "" || r.mood === mood) &&
    (distance === "" || r.distance === distance)
  );

  if (!route) {
    alert("条件に合うルートがありません");
    return;
  }

  // 既存の表示をクリア
  if (polyline) polyline.setMap(null);
  markers.forEach(m => m.setMap(null));
  markers = [];

  // マーカー設置
  route.path.forEach((pos, index) => {
    const marker = new google.maps.Marker({
      position: pos,
      map: map,
      label: index === 0 ? "S" : "G"
    });
    markers.push(marker);
  });

  // ルート線描画
  polyline = new google.maps.Polyline({
    path: route.path,
    geodesic: true,
    strokeColor: "#FF0000",
    strokeOpacity: 1.0,
    strokeWeight: 3
  });
  polyline.setMap(map);

  map.setCenter(route.path[0]);
  map.setZoom(14);
}
</script>

<!-- Google Maps API -->
<script async
  src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap">
</script>

</body>
</html>
